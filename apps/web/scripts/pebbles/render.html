<!doctype html><html><body style="margin:0;background:transparent">
<pre id="out"></pre>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const W=480,H=400;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(W,H);renderer.setClearColor(0x000000,0);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.VSMShadowMap;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;
// iso-ish camera
const s=1.9;const cam=new THREE.OrthographicCamera(-s*W/H,s*W/H,s,-s,0.1,50);
const az=THREE.MathUtils.degToRad(38),el=THREE.MathUtils.degToRad(28);
cam.position.set(Math.sin(az)*Math.cos(el)*10,Math.sin(el)*10,Math.cos(az)*Math.cos(el)*10);cam.lookAt(0,0.55,0);
// lights
const key=new THREE.DirectionalLight(0xfff4ea,2.4);key.position.set(-3,6,4);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);key.shadow.radius=14;key.shadow.blurSamples=24;key.shadow.bias=-0.0005;
Object.assign(key.shadow.camera,{left:-3,right:3,top:3,bottom:-3,near:0.1,far:20});scene.add(key);
const rim=new THREE.DirectionalLight(0xdfe6ff,1.1);rim.position.set(3,2.5,-4);scene.add(rim);
scene.add(new THREE.HemisphereLight(0xffffff,0x2a2a2c,0.55));
// shadow catcher
const ground=new THREE.Mesh(new THREE.PlaneGeometry(12,12),new THREE.ShadowMaterial({opacity:0.38}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
// AO blob
const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
const rg=g.createRadialGradient(128,128,0,128,128,128);rg.addColorStop(0,'rgba(0,0,0,0.85)');rg.addColorStop(0.5,'rgba(0,0,0,0.35)');rg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=rg;g.fillRect(0,0,256,256);
const aoTex=new THREE.CanvasTexture(c);
function ao(rx,rz,y=0.002){const m=new THREE.Mesh(new THREE.PlaneGeometry(rx*2,rz*2),new THREE.MeshBasicMaterial({map:aoTex,transparent:true,depthWrite:false}));m.rotation.x=-Math.PI/2;m.position.y=y;return m;}
// grain bump
const n=document.createElement('canvas');n.width=n.height=512;const ng=n.getContext('2d');const id=ng.createImageData(512,512);
for(let i=0;i<id.data.length;i+=4){const v=128+(Math.random()-0.5)*70;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255;}ng.putImageData(id,0,0);
const grain=new THREE.CanvasTexture(n);grain.wrapS=grain.wrapT=THREE.RepeatWrapping;grain.repeat.set(5,5);
function noise3(x,y,z,seed){return Math.sin(x*1.7+seed)*Math.cos(z*1.3+seed*0.7)*0.5+Math.sin(y*2.1+x*0.9+seed*1.3)*0.5;}
function pebbleGeo(sx,sy,sz,seed=1,flat=0.35,amp=0.06){
  const geo=new THREE.SphereGeometry(1,160,120);const p=geo.attributes.position;const v=new THREE.Vector3();
  for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);
    const d=1+amp*noise3(v.x,v.y,v.z,seed);v.multiplyScalar(d);
    v.x*=sx;v.z*=sz;v.y*=sy;
    v.x+= -0.10*v.y*sx; // lean: top shifted back-left
    if(v.y<0){v.y*=flat;} // flattened underside
    p.setXYZ(i,v.x,v.y,v.z);}
  geo.computeVertexNormals();geo.computeBoundingBox();const bb=geo.boundingBox;geo.translate(0,-bb.min.y,0);return geo;}
const COLORS={stone:0xE6E0D6,coral:0xEF6E50,blue:0x8099E6,rock:0x48484C};
function mat(col,rough=0.6){return new THREE.MeshPhysicalMaterial({color:COLORS[col],roughness:rough,metalness:0,clearcoat:0.12,clearcoatRoughness:0.7,sheen:0.25,sheenRoughness:0.9,sheenColor:new THREE.Color(0xffffff),bumpMap:grain,bumpScale:1.6,envMapIntensity:0.55});}
const ray=new THREE.Raycaster();
function surfacePoint(mesh,dir,origin){ray.set(origin.clone().add(dir.clone().multiplyScalar(10)),dir.clone().negate());const h=ray.intersectObject(mesh,false)[0];return h;}
const eyeMat=new THREE.MeshStandardMaterial({color:0x14100e,roughness:0.75,metalness:0});
function placeOnSurface(obj,hit,up){const nrm=hit.face.normal.clone().transformDirection(hit.object.matrixWorld);obj.position.copy(hit.point).add(nrm.clone().multiplyScalar(0.004));
  const m=new THREE.Matrix4();const zAxis=nrm.clone();const xAxis=new THREE.Vector3().crossVectors(up,zAxis).normalize();const yAxis=new THREE.Vector3().crossVectors(zAxis,xAxis);m.makeBasis(xAxis,yAxis,zAxis);obj.quaternion.setFromRotationMatrix(m);}
function eyes(mesh,kind,size){
  const grp=new THREE.Group();const center=new THREE.Vector3(0,mesh.geometry.boundingBox.max.y*0.55+mesh.position.y,0).add(new THREE.Vector3(mesh.position.x,0,mesh.position.z));
  const camAz=az+THREE.MathUtils.degToRad(16);const sep=THREE.MathUtils.degToRad(14.5*(size>1?1.25:1));const yOff=kind==='up'?0.26:0.0;
  for(const k of [-1,1]){const a=camAz+k*sep;const dir=new THREE.Vector3(Math.sin(a),0.36+yOff,Math.cos(a)).normalize();
    const hit=surfacePoint(mesh,dir,center);if(!hit)continue;let o;const r=0.095*size;
    if(kind==='open'||kind==='up'){o=new THREE.Mesh(new THREE.SphereGeometry(r,32,16),eyeMat);o.scale.set(1,1.12,0.35);}
    else if(kind==='closed'){o=new THREE.Mesh(new THREE.TorusGeometry(r*1.15,r*0.24,12,40,Math.PI),eyeMat);o.rotation.z=Math.PI;const w=new THREE.Group();w.add(o);o=w;}
    else if(kind==='x'){o=new THREE.Group();for(const t of[1,-1]){const b=new THREE.Mesh(new THREE.CapsuleGeometry(r*0.24,r*2.0,6,12),eyeMat);b.rotation.z=t*Math.PI/4;o.add(b);}}
    else if(kind==='flat'){o=new THREE.Mesh(new THREE.CapsuleGeometry(r*0.24,r*1.9,6,12),eyeMat);o.rotation.z=Math.PI/2;const w=new THREE.Group();w.add(o);o=w;}
    const holder=new THREE.Group();holder.add(o);placeOnSurface(holder,hit,new THREE.Vector3(0,1,0));grp.add(holder);}
  return grp;}
function build(v){
  const root=new THREE.Group();let y=0;
  const cairn=v.cairn||0;const RX=[1.5,1.22,1.34,1.08,1.2,0.98];const SYS=[0.42,0.36,0.4,0.34,0.38,0.33];const OFF=[0,-0.08,0.1,-0.05,0.07,-0.03];
  for(let k=0;k<cairn;k++){const st=new THREE.Mesh(pebbleGeo(RX[k],SYS[k],RX[k]*0.86,k*3.1+2,0.55,0.12),mat('rock',0.8));st.position.set(OFF[k]+(v.lean||0)*k*0.06,y,OFF[(k+2)%6]);st.castShadow=true;st.receiveShadow=true;root.add(st);y+=st.geometry.boundingBox.max.y*0.8;}
  const peb=new THREE.Mesh(pebbleGeo(1.2,1.02,0.98,v.seed||1.3,0.38),mat(v.color));peb.position.y=y;if(cairn)peb.position.x=OFF[cairn-1]+(v.lean||0)*(cairn-1)*0.06;
  peb.castShadow=true;peb.receiveShadow=true;root.add(peb);peb.updateMatrixWorld(true);
  if(v.eyes)root.add(eyes(peb,v.eyes,v.eyeSize||1));
  if(!v.icon)root.add(ao(cairn?1.6:1.35,cairn?1.3:1.05));return root;}
const variants=JSON.parse(decodeURIComponent(location.hash.slice(1)));const out={};
for(const v of variants){const extra=(v.cairn||0)*0.42+0.25;const Wv=v.cairn?720:480;cam.left=-s*Wv/H;cam.right=s*Wv/H;cam.top=s+extra;cam.updateProjectionMatrix();const Hv=Math.round(H*(cam.top-cam.bottom)/(2*s));renderer.setSize(Wv,Hv);ground.visible=!v.icon;const obj=build(v);scene.add(obj);obj.updateMatrixWorld(true);renderer.render(scene,cam);
  const a=new THREE.Vector3(0,0,0).project(cam);out[v.name]={png:renderer.domElement.toDataURL('image/png'),ax:(a.x+1)/2*Wv,ay:(1-a.y)/2*Hv,w:Wv,h:Hv};scene.remove(obj);}
document.getElementById('out').textContent=JSON.stringify(out);
</script></body></html>
